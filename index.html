<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystery Dining Reservations</title>
  <!-- Google Fonts  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Brandon+Text:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Link to Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
 
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">🔎 Mystery Dining</div>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Reservations</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Experience the Unknown</h1>
        <p>
          Reserve your seat and embark on a surprise culinary adventure.
        </p>
        <div class="reservation-card">
          <h2>Reserve Now</h2>
          <div class="form-placeholder">
            <form>
              <fieldset>
                <legend class="h5 mb-3">Reservation details</legend>

                <div class="mb-3">
                  <label for="res-name" class="form-label visually-hidden">Name</label>
                  <input id="res-name" name="name" type="text" class="form-control" autocomplete="name" placeholder="Full name" required autofocus>
                </div>

                <div class="mb-3">
                  <label for="res-email" class="form-label visually-hidden">Email</label>
                  <input id="res-email" name="email" type="email" class="form-control" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                  <label for="res-zip" class="form-label visually-hidden">Zip</label>
                  <input id="res-zip" name="zip" type="text" class="form-control" inputmode="numeric" autocomplete="postal-code" placeholder="Zip" required>
                </div>

                <div class="mb-3">
                  <label for="res-party" class="form-label visually-hidden">Party Size</label>
                  <input id="res-party" name="partySize" type="number" class="form-control" min="1" placeholder="Party Size" required>
                </div>

                <div class="mb-3">
                  <label for="res-heat" class="form-label visually-hidden">Preferred heat level</label>
                  <select id="res-heat" name="heatLevel" class="form-select" required>
                    <option value="" selected disabled>Preferred heat level</option>
                    <option value="mild">Mild</option>
                    <option value="med">Medium</option>
                    <option value="spicy">Spicy</option>
                  </select>
                </div>

                <div class="form-check mb-3">
                  <input id="res-bday" name="birthdayPretend" class="form-check-input" type="checkbox">
                  <label class="form-check-label" for="res-bday">
                    Would you like to pretend it's your birthday for free cake?
                  </label>
                </div>

                <div class="form-check mb-3">
                  <input id="res-consent" name="consent" class="form-check-input" type="checkbox" required>
                  <label class="form-check-label" for="res-consent">
                    I accept that I have no idea where I'll dine, and that's OK.
                  </label>
                </div>

                <button type="submit" class="btn btn-lg btn-primary">Book My Mystery Meal!</button>
              </fieldset>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Mystery Dining. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
